name: Smoke test data

on:
  pull_request:
    paths:
      - '.claude/skills/search/data/**'
      - '.claude/skills/search/scripts/**'
      - 'scripts/**'
      - '.github/workflows/smoke-stacks.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run aggregate offline data gate
        run: |
          python3 scripts/validate-csv.py
          python3 .claude/skills/search/scripts/validate_data.py
          python3 scripts/validate-agent-guide.py
          python3 scripts/generate-catalog-summary.py --check
          python3 -m unittest discover -s .claude/skills/search/scripts/tests -p 'test_*.py'
          python3 scripts/evaluate-relevance.py
          bash scripts/smoke-domains.sh
          bash scripts/smoke-stacks.sh
